name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build + test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build sqlite3
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  tsan:
    name: ThreadSanitizer (unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Newer runner kernels use high-entropy mmap ASLR that older TSan
      # runtimes reject; lower it for this job only.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DMEMLOC_SANITIZER=thread -DMEMLOC_BUILD_BENCH=OFF
      - run: cmake --build build
      - run: TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build --output-on-failure -j4 -L unit

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==21.1.8
      - run: tools/check_format.sh

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pip install clang-tidy==21.1.6
      - name: Configure (compile_commands.json)
        run: CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DMEMLOC_BUILD_BENCH=OFF
      - name: Build (generates FetchContent headers)
        run: cmake --build build
      - run: tools/run_tidy.sh build
